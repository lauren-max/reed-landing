<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Reed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F8F6F1; color: #1A1A1A; font-family: 'Inter', system-ui, sans-serif; font-weight: 300; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; -webkit-font-smoothing: antialiased; }
    .inner { max-width: 480px; }
    .wordmark { font-family: 'EB Garamond', Georgia, serif; font-size: 2.5rem; font-weight: 500; letter-spacing: -0.02em; color: #1A1A1A; margin-bottom: 32px; display: block; text-decoration: none; }
    .wordmark span { color: #D0021B; }
    h1 { font-family: 'EB Garamond', Georgia, serif; font-size: 2rem; font-weight: 500; line-height: 1.2; margin-bottom: 16px; }
    p { font-size: 0.95rem; color: #555; line-height: 1.7; margin-bottom: 36px; }
    a.back { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #1A1A1A; text-decoration: none; border-bottom: 1px solid #E0DDD5; padding-bottom: 2px; transition: border-color 0.2s; }
    a.back:hover { border-color: #D0021B; color: #D0021B; }
  </style>
</head>
<body>
  <div class="inner">
    <a href="/" class="wordmark">Reed<span>.</span></a>
    <h1>You are on the list.</h1>
    <p>We will be in touch when Reed is ready. In the meantime, thank you for your interest.</p>
    <a href="/" class="back">Back to Reed</a>
  </div>
</body>
</html>
